name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 18 * * *' # nightly deep run, 02:00 Philippine time
  workflow_dispatch:
    inputs:
      deep:
        description: 'Also run stress, spike, breakpoint, soak and the experiments'
        type: boolean
        default: false

env:
  # TaskFlow is checked out at a pinned commit, so a result changes only when this repo changes.
  # To test a newer TaskFlow, bump this SHA in its own PR and compare the runs.
  TASKFLOW_REF: e9012be4e9d5aa965195c5a74316481751c75a3d
  K6_VERSION: '2.3.0'

jobs:
  lint:
    name: Lint + format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - name: Gate checker self-tests (each gate must fail a bad run)
        run: npm test

  gate:
    name: Performance gate (smoke + load)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: VincentJerico/taskflow-under-test
          ref: ${{ env.TASKFLOW_REF }}
          path: sut
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: grafana/setup-k6-action@v1
        with:
          k6-version: ${{ env.K6_VERSION }}
      - run: k6 inspect scenarios/smoke.js > /dev/null # fail fast on a script that doesn't compile
      - name: Start TaskFlow
        run: bash scripts/start-sut.sh
        env:
          SUT_DIR: sut
      - name: Smoke test
        run: bash scripts/run.sh scenarios/smoke.js
      - name: Gate self-test (the gate must be able to fail)
        run: bash selftest/gate-must-fail.sh
      - name: Load test (SLO gate)
        run: bash scripts/run.sh scenarios/load.js
      - name: Job summary
        if: ${{ !cancelled() }}
        run: node scripts/job-summary.mjs reports/*-summary.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: gate-reports
          path: reports/
          retention-days: 14

  deep:
    name: Deep run (${{ matrix.test }}${{ matrix.rate && format(' {0}/s', matrix.rate) || '' }}${{ matrix.measured && ', measured' || '' }})
    if: ${{ github.event_name == 'schedule' || inputs.deep }}
    needs: gate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test: [stress, spike, breakpoint, soak, list-growth]
        # PERF-001 is gated at 10 and 30 logins/s. At 60/s the result depends on how much spare CPU
        # the runner has (OBS-003), so it's measured and recorded but doesn't fail the run.
        include:
          - test: auth-contention
            rate: 10
          - test: auth-contention
            rate: 30
          - test: auth-contention
            rate: 60
            measured: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: VincentJerico/taskflow-under-test
          ref: ${{ env.TASKFLOW_REF }}
          path: sut
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: grafana/setup-k6-action@v1
        with:
          k6-version: ${{ env.K6_VERSION }}
      - name: Start TaskFlow
        run: bash scripts/start-sut.sh
        env:
          SUT_DIR: sut
      - name: Run ${{ matrix.test }}
        run: |
          case "${{ matrix.test }}" in
            soak)
              bash scripts/sample-rss.sh &
              bash scripts/run.sh scenarios/soak.js -e DURATION=30m ;;
            breakpoint)
              # A breakpoint test is supposed to end by breaking the SLO (exit 99).
              # Exit 0 means the runner never found the limit; both are results.
              bash scripts/run.sh scenarios/breakpoint.js || [ $? -eq 99 ] ;;
            auth-contention)
              k6 run --quiet -e LOGIN_RATE=${{ matrix.rate }} experiments/auth-contention.js ;;
            list-growth)
              k6 run --quiet experiments/list-growth.js ;;
            *)
              bash scripts/run.sh "scenarios/${{ matrix.test }}.js" ;;
          esac
      # shell: bash adds -o pipefail, so the checker's exit code survives the pipe into tee.
      - name: PERF-001 gate (readers p95 during logins within 2x baseline)
        if: ${{ matrix.test == 'auth-contention' }}
        shell: bash
        run: |
          set +e
          node scripts/check-auth-contention.mjs reports/auth-contention.json | tee -a "$GITHUB_STEP_SUMMARY"
          code=${PIPESTATUS[0]}
          # Measured rates report the verdict but only fail when there was nothing to check (exit 2).
          if [ "${{ matrix.measured }}" = true ] && [ "$code" -eq 1 ]; then
            echo "Measured at this rate, not gated (OBS-003)." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit "$code"
      - name: Soak memory gate (OBS-002)
        if: ${{ matrix.test == 'soak' }}
        shell: bash
        run: node scripts/check-soak-rss.mjs reports/soak-rss.csv | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Job summary
        if: ${{ !cancelled() }}
        run: |
          shopt -s nullglob
          for f in reports/*-summary.json; do node scripts/job-summary.mjs "$f" >> "$GITHUB_STEP_SUMMARY"; done
          for f in reports/*.md; do cat "$f" >> "$GITHUB_STEP_SUMMARY"; done
          if [ -f reports/soak-rss.csv ]; then
            { echo '### Server memory during soak (MB)'; echo '```'; cat reports/soak-rss.csv; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: ${{ matrix.test }}${{ matrix.rate && format('-{0}', matrix.rate) || '' }}-reports
          path: reports/
          retention-days: 14

  auth-gate-selftest:
    name: PERF-001 gate self-test (old TaskFlow must fail)
    if: ${{ github.event_name == 'schedule' || inputs.deep }}
    needs: gate
    runs-on: ubuntu-latest
    env:
      # The last TaskFlow commit with scryptSync. A gate that can't catch it isn't a gate.
      OLD_TASKFLOW_REF: 8b0d564ca225877e7d0b05d11f7305da975d9bc3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: VincentJerico/taskflow-under-test
          ref: ${{ env.OLD_TASKFLOW_REF }}
          path: sut
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: grafana/setup-k6-action@v1
        with:
          k6-version: ${{ env.K6_VERSION }}
      - name: Start the old TaskFlow
        run: bash scripts/start-sut.sh
        env:
          SUT_DIR: sut
      - name: Auth contention at 30 logins/s
        run: k6 run --quiet -e LOGIN_RATE=30 experiments/auth-contention.js
      - name: The gate must fail on the old build (exit 1)
        shell: bash
        run: |
          set +e
          node scripts/check-auth-contention.mjs reports/auth-contention.json | tee -a "$GITHUB_STEP_SUMMARY"
          code=${PIPESTATUS[0]}
          if [ "$code" -eq 1 ]; then
            echo "PASS: the PERF-001 gate caught the scryptSync build" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "FAIL: expected the gate to exit 1 on the old build, got $code" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: auth-gate-selftest-reports
          path: reports/
          retention-days: 14

  report:
    name: Record results (history, LATEST.md, trend page)
    needs: [gate, deep, auth-gate-selftest]
    # Record every deep run, including failing ones; only nightly runs on main are published.
    if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.deep) }}
    runs-on: ubuntu-latest
    concurrency:
      group: results-history
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      actions: read
    env:
      PUBLISH: ${{ github.event_name == 'schedule' && github.ref == 'refs/heads/main' }}
      GH_TOKEN: ${{ github.token }}
      RESULTS_PR_BRANCH: bot/nightly-results
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Read the results history (results branch)
        run: |
          if git ls-remote --exit-code --heads origin results >/dev/null; then
            git fetch -q origin results
            git show origin/results:history.jsonl > history.jsonl
          else
            : > history.jsonl
          fi
          echo "history: $(wc -l < history.jsonl) runs"
      - name: Record this run
        run: |
          started="$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}" --jq .run_started_at)"
          node scripts/extract-run.mjs artifacts \
            --run-id "${{ github.run_id }}" --date "$started" --commit "${{ github.sha }}" \
            --taskflow-ref "$TASKFLOW_REF" --event "${{ github.event_name }}" > record.json
          if [ "$PUBLISH" = true ]; then cat record.json >> history.jsonl; fi
      - name: Build LATEST.md and the trend page
        run: |
          # A branch run isn't added to the history, but its own record is shown as the latest.
          if [ "$PUBLISH" = true ]; then src=history.jsonl; else cat history.jsonl record.json > preview.jsonl; src=preview.jsonl; fi
          node scripts/render-results.mjs "$src" > LATEST.md
          npx prettier --write LATEST.md
          node scripts/build-trends.mjs "$src" site
          cat LATEST.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: results-report
          path: |
            record.json
            history.jsonl
            LATEST.md
            site/
          retention-days: 14
      - name: Save the history (nightly on main only)
        if: ${{ env.PUBLISH == 'true' }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --heads origin results >/dev/null; then
            git worktree add -q results-wt origin/results
            git -C results-wt switch -q -C results
          else
            git worktree add -q --orphan -b results results-wt
          fi
          cp history.jsonl results-wt/history.jsonl
          git -C results-wt add history.jsonl
          git -C results-wt commit -q -m "chore(results): record run ${{ github.run_id }}"
          git -C results-wt push -q origin results
      - name: Update the rolling results PR (nightly on main only)
        if: ${{ env.PUBLISH == 'true' }}
        run: |
          git switch -q -C "$RESULTS_PR_BRANCH" "${{ github.sha }}"
          mkdir -p docs/results
          cp LATEST.md docs/results/LATEST.md
          git add docs/results/LATEST.md
          if git diff --cached --quiet; then echo "LATEST.md unchanged"; exit 0; fi
          git commit -q -m "chore(results): nightly results from run ${{ github.run_id }}"
          git push -q -f origin "$RESULTS_PR_BRANCH"
          if [ -z "$(gh pr list --head "$RESULTS_PR_BRANCH" --state open --json number --jq '.[0].number')" ]; then
            gh pr create --base main --head "$RESULTS_PR_BRANCH" \
              --title 'chore(results): nightly results' \
              --body 'Regenerated by the nightly CI run from the results history (\`scripts/render-results.mjs\`). Each night replaces the previous commit on this branch. Merge it when you want the latest numbers in \`docs/results/LATEST.md\`.'
          fi
      - uses: actions/upload-pages-artifact@v5
        if: ${{ env.PUBLISH == 'true' }}
        with:
          path: site

  pages:
    name: Publish the trend page
    needs: report
    if: ${{ github.event_name == 'schedule' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
