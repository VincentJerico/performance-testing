name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 18 * * *' # nightly deep run, 02:00 Philippine time
  workflow_dispatch:
    inputs:
      deep:
        description: 'Also run stress, spike, breakpoint, soak and the experiments'
        type: boolean
        default: false

env:
  # TaskFlow is checked out at a pinned commit, so a result changes only when this repo changes.
  # To test a newer TaskFlow, bump this SHA in its own PR and compare the runs.
  TASKFLOW_REF: e9012be4e9d5aa965195c5a74316481751c75a3d
  K6_VERSION: '2.3.0'

jobs:
  lint:
    name: Lint + format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - name: Gate checker self-tests (each gate must fail a bad run)
        run: npm test

  gate:
    name: Performance gate (smoke + load)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: VincentJerico/taskflow-under-test
          ref: ${{ env.TASKFLOW_REF }}
          path: sut
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: grafana/setup-k6-action@v1
        with:
          k6-version: ${{ env.K6_VERSION }}
      - run: k6 inspect scenarios/smoke.js > /dev/null # fail fast on a script that doesn't compile
      - name: Start TaskFlow
        run: bash scripts/start-sut.sh
        env:
          SUT_DIR: sut
      - name: Smoke test
        run: bash scripts/run.sh scenarios/smoke.js
      - name: Gate self-test (the gate must be able to fail)
        run: bash selftest/gate-must-fail.sh
      - name: Load test (SLO gate)
        run: bash scripts/run.sh scenarios/load.js
      - name: Job summary
        if: ${{ !cancelled() }}
        run: node scripts/job-summary.mjs reports/*-summary.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: gate-reports
          path: reports/
          retention-days: 14

  deep:
    name: Deep run (${{ matrix.test }}${{ matrix.rate && format(' {0}/s', matrix.rate) || '' }}${{ matrix.measured && ', measured' || '' }})
    if: ${{ github.event_name == 'schedule' || inputs.deep }}
    needs: gate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test: [stress, spike, breakpoint, soak, list-growth]
        # PERF-001 is gated at 10 and 30 logins/s. At 60/s the result depends on how much spare CPU
        # the runner has (OBS-003), so it's measured and recorded but doesn't fail the run.
        include:
          - test: auth-contention
            rate: 10
          - test: auth-contention
            rate: 30
          - test: auth-contention
            rate: 60
            measured: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: VincentJerico/taskflow-under-test
          ref: ${{ env.TASKFLOW_REF }}
          path: sut
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: grafana/setup-k6-action@v1
        with:
          k6-version: ${{ env.K6_VERSION }}
      - name: Start TaskFlow
        run: bash scripts/start-sut.sh
        env:
          SUT_DIR: sut
      - name: Run ${{ matrix.test }}
        run: |
          case "${{ matrix.test }}" in
            soak)
              bash scripts/sample-rss.sh &
              bash scripts/run.sh scenarios/soak.js -e DURATION=30m ;;
            breakpoint)
              # A breakpoint test is supposed to end by breaking the SLO (exit 99).
              # Exit 0 means the runner never found the limit; both are results.
              bash scripts/run.sh scenarios/breakpoint.js || [ $? -eq 99 ] ;;
            auth-contention)
              k6 run --quiet -e LOGIN_RATE=${{ matrix.rate }} experiments/auth-contention.js ;;
            list-growth)
              k6 run --quiet experiments/list-growth.js ;;
            *)
              bash scripts/run.sh "scenarios/${{ matrix.test }}.js" ;;
          esac
      # shell: bash adds -o pipefail, so the checker's exit code survives the pipe into tee.
      - name: PERF-001 gate (readers p95 during logins within 2x baseline)
        if: ${{ matrix.test == 'auth-contention' }}
        shell: bash
        run: |
          set +e
          node scripts/check-auth-contention.mjs reports/auth-contention.json | tee -a "$GITHUB_STEP_SUMMARY"
          code=${PIPESTATUS[0]}
          # Measured rates report the verdict but only fail when there was nothing to check (exit 2).
          if [ "${{ matrix.measured }}" = true ] && [ "$code" -eq 1 ]; then
            echo "Measured at this rate, not gated (OBS-003)." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit "$code"
      - name: Soak memory gate (OBS-002)
        if: ${{ matrix.test == 'soak' }}
        shell: bash
        run: node scripts/check-soak-rss.mjs reports/soak-rss.csv | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Job summary
        if: ${{ !cancelled() }}
        run: |
          shopt -s nullglob
          for f in reports/*-summary.json; do node scripts/job-summary.mjs "$f" >> "$GITHUB_STEP_SUMMARY"; done
          for f in reports/*.md; do cat "$f" >> "$GITHUB_STEP_SUMMARY"; done
          if [ -f reports/soak-rss.csv ]; then
            { echo '### Server memory during soak (MB)'; echo '```'; cat reports/soak-rss.csv; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: ${{ matrix.test }}${{ matrix.rate && format('-{0}', matrix.rate) || '' }}-reports
          path: reports/
          retention-days: 14

  auth-gate-selftest:
    name: PERF-001 gate self-test (old TaskFlow must fail)
    if: ${{ github.event_name == 'schedule' || inputs.deep }}
    needs: gate
    runs-on: ubuntu-latest
    env:
      # The last TaskFlow commit with scryptSync. A gate that can't catch it isn't a gate.
      OLD_TASKFLOW_REF: 8b0d564ca225877e7d0b05d11f7305da975d9bc3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: VincentJerico/taskflow-under-test
          ref: ${{ env.OLD_TASKFLOW_REF }}
          path: sut
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: grafana/setup-k6-action@v1
        with:
          k6-version: ${{ env.K6_VERSION }}
      - name: Start the old TaskFlow
        run: bash scripts/start-sut.sh
        env:
          SUT_DIR: sut
      - name: Auth contention at 30 logins/s
        run: k6 run --quiet -e LOGIN_RATE=30 experiments/auth-contention.js
      - name: The gate must fail on the old build (exit 1)
        shell: bash
        run: |
          set +e
          node scripts/check-auth-contention.mjs reports/auth-contention.json | tee -a "$GITHUB_STEP_SUMMARY"
          code=${PIPESTATUS[0]}
          if [ "$code" -eq 1 ]; then
            echo "PASS: the PERF-001 gate caught the scryptSync build" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "FAIL: expected the gate to exit 1 on the old build, got $code" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: auth-gate-selftest-reports
          path: reports/
          retention-days: 14
