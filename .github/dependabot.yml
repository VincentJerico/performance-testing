# Dependency update policy (same across all my QA repos):
# - minor + patch updates are grouped into one weekly PR, so routine bumps land together;
# - major updates arrive as individual PRs, so one breaking change can't block the safe ones.
# k6 itself is pinned in ci.yml (K6_VERSION) and bumped by hand, because a new k6 version can
# change the numbers and should be compared against the old ones in its own PR.
version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns: ['*']
